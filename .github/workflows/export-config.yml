name: Export Fixed Channel Config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export starred upstream configs
        env:
          UPTIME_BASE_URL: https://uptime.maolaoapi.com
          UPTIME_USERNAME: ${{ secrets.UPTIME_USERNAME }}
          UPTIME_PASSWORD: ${{ secrets.UPTIME_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["UPTIME_BASE_URL"].rstrip("/")
          headers = {"Accept": "application/json", "Content-Type": "application/json"}

          def call(path, method="GET", body=None, token=None):
              request_headers = dict(headers)
              if token:
                  request_headers["Authorization"] = f"Bearer {token}"
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + path, data=data, headers=request_headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          login = call("/api/auth/login", "POST", {
              "userName": os.environ["UPTIME_USERNAME"],
              "password": os.environ["UPTIME_PASSWORD"],
          })
          token = login.get("token")
          if not token:
              raise RuntimeError("后台登录响应中没有 token")

          channels_response = call("/api/channels/search", token=token)
          channels = channels_response.get("channels", channels_response if isinstance(channels_response, list) else [])
          result = []
          for item in channels:
              channel = item.get("channel") if isinstance(item.get("channel"), dict) else item
              channel_id = channel.get("id") or channel.get("channelId") or item.get("id")
              name = channel.get("name") or item.get("name")
              starred = channel.get("isStarred", channel.get("starred", item.get("isStarred", item.get("starred", False))))
              if not starred or str(channel_id) == "29" or name == "阿伟":
                  continue
              detail = call(f"/api/channels/{channel_id}", token=token)
              merged = dict(channel)
              merged["isStarred"] = True
              merged["detail"] = detail
              result.append(merged)

          with open("channels-config.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, separators=(",", ":"))
          print(f"Exported {len(result)} starred channel configs")
          PY
      - name: Upload private config artifact
        uses: actions/upload-artifact@v4
        with:
          name: channels-config
          path: channels-config.json
          retention-days: 1
