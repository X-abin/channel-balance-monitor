name: Check Channel Balance

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run balance check
        id: balance_check
        continue-on-error: true
        env:
          UPTIME_BASE_URL: https://uptime.maolaoapi.com
          UPTIME_USERNAME: ${{ secrets.UPTIME_USERNAME }}
          UPTIME_PASSWORD: ${{ secrets.UPTIME_PASSWORD }}
          UPTIME_TOKEN: ${{ secrets.UPTIME_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALANCE_THRESHOLD: "30"
          NOTIFY_COOLDOWN_HOURS: "12"
        run: python scripts/check_balance.py

      - name: Publish status to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/alert-state.json
          if git diff --cached --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "Update status snapshot"
            git push
          fi

      - name: Fail when balance check failed
        if: steps.balance_check.outcome == 'failure'
        run: exit 1
