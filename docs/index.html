<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>渠道余额监测</title>
    <link rel="stylesheet" href="styles.css?v=20260822-refresh-desc" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">Channel Balance Monitor</p>
          <h1>渠道余额监测</h1>
          <p class="summary" id="summary">正在读取最近一次检查结果...</p>
        </div>
        <div class="hero-actions">
          <button class="refresh-button" id="refresh-button" type="button">刷新结果</button>
          <button class="refresh-button primary" id="run-button" type="button">立即检测</button>
          <div class="status-pill" id="status-pill">读取中</div>
        </div>
      </section>

      <section class="panel token-panel" aria-label="GitHub Token 设置">
        <div class="panel-head">
          <h2>GitHub Token</h2>
          <span>保存在当前浏览器</span>
        </div>
        <div class="token-row">
          <label class="token-field" for="github-token">
            <span>重新填写 Token</span>
            <input id="github-token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴新的 GitHub Token" />
          </label>
          <div class="token-actions">
            <button class="refresh-button primary" id="save-token-button" type="button">保存 Token</button>
            <button class="refresh-button" id="clear-token-button" type="button">清除 Token</button>
          </div>
        </div>
        <p class="token-hint" id="token-hint">未保存 Token 时，点“立即检测”会先询问你输入。</p>
      </section>

      <section class="metrics" aria-label="概览">
        <div class="metric">
          <span>监测渠道</span>
          <strong id="total-count">-</strong>
        </div>
        <div class="metric">
          <span>低余额</span>
          <strong id="low-count">-</strong>
        </div>
        <div class="metric">
          <span>提醒阈值</span>
          <strong id="threshold">-</strong>
        </div>
        <div class="metric">
          <span>最近检查</span>
          <strong id="checked-at">-</strong>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>低余额渠道</h2>
          <span id="alert-note">余额低于阈值时会显示在这里</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>渠道</th>
                <th>星标</th>
                <th>余额</th>
                <th>来源</th>
                <th>阈值</th>
                <th>上次同步</th>
              </tr>
            </thead>
            <tbody id="low-table">
              <tr><td colspan="6">正在读取...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>全部渠道</h2>
          <span>按余额从低到高排列</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>渠道</th>
                <th>星标</th>
                <th>余额</th>
                <th>来源</th>
                <th>令牌数</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="all-table">
              <tr><td colspan="6">正在读取...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js?v=20260822-refresh-desc"></script>
  </body>
</html>
